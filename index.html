<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating CSS Effects</title>

  <!-- 1. Google Fonts Link (Roboto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- 2. Link to your local CSS file -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section class="gallery-section">
    <h1>Custom Typography & Image Hover Effects</h1>
    <p>Hover over the images below to see the CSS transformation effects!</p>

    <div class="gallery-container">
      
      <!-- Card 1: Scale / Zoom Effect -->
      <div class="image-card">
        <img src="https://picsum.photos/id/1018/400/300" alt="Landscape Photo 1" class="hover-scale">
        <p>Zoom Scale Effect</p>
      </div>

      <!-- Card 2: Rotation Effect -->
      <div class="image-card">
        <img src="https://picsum.photos/id/1015/400/300" alt="Landscape Photo 2" class="hover-rotate">
        <p>Rotate Effect</p>
      </div>

      <!-- Card 3: Color Transition Effect -->
      <div class="image-card">
        <img src="https://picsum.photos/id/1019/400/300" alt="Landscape Photo 3" class="hover-color">
        <p>Color Filter Effect</p>
      </div>

    </div>
  </section>

</body>
</html>
